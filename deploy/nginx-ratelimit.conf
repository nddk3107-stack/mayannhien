# Định nghĩa zone rate-limit cho nginx (được include bởi deploy/nginx-mayan.conf).
# Cài đặt:
#   sudo cp deploy/nginx-ratelimit.conf /etc/nginx/conf.d/mayan-ratelimit.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# zone mayan_api  : hạn chế chung cho mọi API — 20 req/giây/IP, cho phép burst 40.
# zone mayan_auth : hạn chế chặt cho đăng nhập/đăng ký — 5 req/phút/IP.
#
# Lưu ý: rate-limit trong ứng dụng (server/auth.js) vẫn hoạt động độc lập và là
# lớp thứ hai. Ở production chỉ cần bật MỘT tầng nginx và đặt
# TRUST_PROXY_HOPS=1 để ứng dụng nhìn đúng IP thật của client.

limit_req_zone $binary_remote_addr zone=mayan_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=mayan_auth:10m rate=5r/m;

# Giới hạn số kết nối đồng thời cho mỗi IP (chống kiểu tấn công chậm).
limit_conn_zone $binary_remote_addr zone=mayan_conn:10m;
