# Cấu hình nginx làm reverse proxy cho Mây An Nhiên.
# Cài đặt:
#   sudo cp deploy/nginx-mayan.conf /etc/nginx/sites-available/mayan
#   sudo ln -s /etc/nginx/sites-available/mayan /etc/nginx/sites-enabled/mayan
#   sudo nginx -t && sudo systemctl reload nginx
#
# THAY THẾ các giá trị placeholder trước khi dùng:
#   mayan.example.com  -> domain thật của bạn
#   /var/www/mayan     -> thư mục cài đặt thật
#
# LƯU Ý: file này KHÔNG chứa khóa TLS thật. Chứng chỉ được sinh bởi
# certbot (hoặc Let's Encrypt) và nằm ở /etc/letsencrypt (ngoài repo).

# --- HTTP: chuyển sang HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name mayan.example.com;

    # Certbot dùng thư mục này để xác minh domain (HTTP-01 challenge).
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mayan.example.com;

    # Đường dẫn chứng chỉ (sinh tự động bởi certbot — KHÔNG commit vào git).
    ssl_certificate     /etc/letsencrypt/live/mayan.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mayan.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Header bảo mật (bổ sung ngoài CSP do backend gửi).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Giới hạn kích thước request khớp với giới hạn của Express.
    client_max_body_size 1m;

    # Nén gzip cho static + JSON
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    # --- Rate limit ở tầng proxy (bổ sung cho rate-limit trong ứng dụng) ---
    # Định nghĩa trong /etc/nginx/conf.d/mayan-ratelimit.conf:
    #   limit_req_zone $binary_remote_addr zone=mayan_api:10m rate=20r/s;
    #   limit_req_zone $binary_remote_addr zone=mayan_auth:10m rate=5r/m;
    limit_req zone=mayan_api burst=40 nodelay;

    # --- IPN webhook của MoMo ---
    # KHÔNG áp dụng rate-limit kiểu strict cho endpoint này (MoMo có thể gọi lặp),
    # nhưng vẫn giới hạn để chống lạm dụng.
    location /api/webhook/ {
        limit_req zone=mayan_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/proxy_params;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 30s;
    }

    # --- Đăng nhập / đăng ký: giới hạn chặt hơn ---
    location ~ ^/api/auth/(login|register)$ {
        limit_req zone=mayan_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/proxy_params;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    # --- API ---
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/proxy_params;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 30s;
    }

    # --- Frontend (bản build tĩnh trong dist/) ---
    root /var/www/mayan/dist;
    index index.html;

    # Tài nguyên có hash trong tên -> cache dài hạn.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: mọi đường dẫn trả index.html (route hash do client xử lý).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
