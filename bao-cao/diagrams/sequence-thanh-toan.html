<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><style>body{margin:0;font-family:Arial,sans-serif}</style></head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="790" viewBox="0 0 960 790">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#1f3b73"/></marker>
    <marker id="arrg" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#276749"/></marker>
    <style>
      .msg{font:12.5px Arial;fill:#111}
      .hd{font:14px Arial;fill:#fff;text-anchor:middle;font-weight:bold}
      .fr{fill:#fbfdff;stroke:#1f3b73;stroke-width:1.6;stroke-dasharray:9 5}
      .lbl{font:12.5px Arial;fill:#1f3b73;font-weight:bold}
    </style>
  </defs>
  <rect x="0" y="0" width="960" height="790" fill="#ffffff"/>
  <text x="480" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f3b73">Sơ đồ Sequence — Quy trình thanh toán &amp; tạo đơn đặt chỗ (demo)</text>

  <!-- lifeline heads -->
  <rect x="45" y="44" width="130" height="44" rx="6" fill="#1f3b73"/>
  <text class="hd" x="110" y="71">Người dùng</text>
  <rect x="295" y="44" width="190" height="44" rx="6" fill="#2b6cb0"/>
  <text class="hd" x="390" y="64">CheckoutPage</text>
  <text class="hd" x="390" y="80" font-size="11.5">(React component)</text>
  <rect x="565" y="44" width="150" height="44" rx="6" fill="#b7791f"/>
  <text class="hd" x="640" y="64">LoginModal</text>
  <text class="hd" x="640" y="80" font-size="11.5">(mô phỏng đăng nhập)</text>
  <rect x="795" y="44" width="150" height="44" rx="6" fill="#276749"/>
  <text class="hd" x="870" y="64">localStorage</text>
  <text class="hd" x="870" y="80" font-size="11.5">(trình duyệt)</text>

  <!-- dashed lifelines -->
  <line x1="110" y1="88" x2="110" y2="740" stroke="#888" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="390" y1="88" x2="390" y2="740" stroke="#888" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="640" y1="88" x2="640" y2="740" stroke="#888" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="870" y1="88" x2="870" y2="740" stroke="#888" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- activation on checkout -->
  <rect x="378" y="118" width="24" height="560" fill="#cfe3f7" stroke="#2b6cb0" stroke-width="1"/>

  <!-- msg 1 -->
  <line x1="110" y1="130" x2="386" y2="130" stroke="#1f3b73" stroke-width="1.8" marker-end="url(#arr)"/>
  <text class="msg" x="120" y="122">1. Click “Xác nhận và thanh toán”</text>

  <!-- self msg 2 -->
  <path d="M390,160 H445 V184 H392" fill="none" stroke="#1f3b73" stroke-width="1.8" marker-end="url(#arr)"/>
  <text class="msg" x="452" y="176">2. Kiểm tra phiên đăng nhập</text>

  <!-- alt frame -->
  <rect class="fr" x="40" y="205" width="900" height="270" rx="6"/>
  <rect x="40" y="205" width="150" height="26" fill="#eef4ff" stroke="#1f3b73" stroke-width="1.6"/>
  <text class="lbl" x="48" y="223">alt [chưa đăng nhập]</text>

  <line x1="402" y1="258" x2="636" y2="258" stroke="#1f3b73" stroke-width="1.8" marker-end="url(#arr)"/>
  <text class="msg" x="412" y="250">3. Kích hoạt login gate — mở modal</text>

  <line x1="636" y1="298" x2="114" y2="298" stroke="#1f3b73" stroke-width="1.8" marker-end="url(#arr)"/>
  <text class="msg" x="300" y="290">4. Hiện LoginModal + toast “Vui lòng đăng nhập để tiếp tục”</text>

  <line x1="110" y1="342" x2="636" y2="342" stroke="#1f3b73" stroke-width="1.8" marker-end="url(#arr)"/>
  <text class="msg" x="240" y="334">5. Nhập email &amp; mật khẩu (validate: email, password ≥ 6 ký tự)</text>

  <line x1="636" y1="386" x2="402" y2="386" stroke="#1f3b73" stroke-width="1.8" marker-end="url(#arr)"/>
  <text class="msg" x="412" y="378">6. onLogin(session) — đóng modal, hiện user-chip</text>

  <line x1="402" y1="434" x2="866" y2="434" stroke="#276749" stroke-width="1.8" marker-end="url(#arrg)"/>
  <text class="msg" x="430" y="426" fill="#276749">7. Lưu phiên: may-an-nhien-session (KHÔNG lưu mật khẩu)</text>

  <!-- main continue -->
  <path d="M402,510 H455 V534 H404" fill="none" stroke="#1f3b73" stroke-width="1.8" marker-end="url(#arr)"/>
  <text class="msg" x="462" y="527">8. Validate form người đặt (tên / SĐT / email)</text>

  <line x1="402" y1="566" x2="866" y2="566" stroke="#276749" stroke-width="1.8" marker-end="url(#arrg)"/>
  <text class="msg" x="430" y="558" fill="#276749">9. Tạo booking {code, status, total, promo, traveler, ...}</text>

  <line x1="402" y1="606" x2="866" y2="606" stroke="#276749" stroke-width="1.8" marker-end="url(#arrg)"/>
  <text class="msg" x="430" y="598" fill="#276749">10. setItem('may-an-nhien-bookings:&lt;email&gt;')</text>

  <line x1="386" y1="650" x2="114" y2="650" stroke="#1f3b73" stroke-width="1.8" marker-end="url(#arr)"/>
  <text class="msg" x="130" y="642">11. Điều hướng #/bookings + toast “Đặt chỗ thành công! Mã đơn MAN…”</text>

  <!-- note -->
  <rect x="150" y="678" width="660" height="50" rx="8" fill="#fff7e6" stroke="#b7791f" stroke-width="1.6"/>
  <text x="480" y="699" text-anchor="middle" font-size="13" fill="#7c4a03">Lưu ý: bước thanh toán KHÔNG gọi API máy chủ — mô phỏng client-side (demo) sau 700ms;</text>
  <text x="480" y="719" text-anchor="middle" font-size="13" fill="#7c4a03">nút được vô hiệu hóa trong lúc xử lý để chống bấm trùng (double-click).</text>

  <!-- bottom -->
  <line x1="110" y1="650" x2="110" y2="676" stroke="#888" stroke-width="1.5"/>
  <circle cx="110" cy="682" r="6" fill="#1f3b73"/>
</svg>
</body></html>
