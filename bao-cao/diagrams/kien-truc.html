<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><style>body{margin:0;font-family:Arial,sans-serif}</style></head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#1f3b73"/></marker>
    <marker id="arrBoth" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#1f3b73"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="620" fill="#ffffff"/>
  <text x="480" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f3b73">Sơ đồ kiến trúc tổng thể hệ thống</text>

  <!-- Box A: Browser SPA -->
  <rect x="30" y="90" width="400" height="430" rx="10" fill="#eef4ff" stroke="#1f3b73" stroke-width="2"/>
  <text x="230" y="122" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f3b73">Trình duyệt — SPA React 19</text>
  <line x1="50" y1="136" x2="410" y2="136" stroke="#1f3b73" stroke-width="1"/>
  <text x="52" y="166" font-size="13.5">• Router hash: #/, #/flight, #/hotel, #/combo,</text>
  <text x="72" y="188" font-size="13.5">#/bookings, #/checkout, trang 404</text>
  <text x="52" y="216" font-size="13.5">• ~26 component (App.jsx, 1.400 dòng)</text>
  <text x="52" y="244" font-size="13.5">• State: CatalogCtx + useState (session,</text>
  <text x="72" y="266" font-size="13.5">bookings, traveler, promo, filters...)</text>
  <text x="52" y="294" font-size="13.5">• Dữ liệu fallback cục bộ (flights, hotels,</text>
  <text x="72" y="316" font-size="13.5">promos) khi API lỗi</text>
  <text x="52" y="344" font-size="13.5">• localStorage:</text>
  <text x="72" y="366" font-size="13">– may-an-nhien-session</text>
  <text x="72" y="388" font-size="13">– may-an-nhien-bookings:&lt;email&gt;</text>
  <text x="72" y="410" font-size="13">– may-an-nhien-traveler</text>
  <text x="52" y="440" font-size="13.5">• Xử lý login/checkout/thanh toán</text>
  <text x="52" y="462" font-size="13.5">  mô phỏng phía client (demo)</text>
  <text x="52" y="492" font-size="13.5">• Fallback banner/strip khi API lỗi</text>

  <!-- Box B: Vite -->
  <rect x="490" y="140" width="170" height="150" rx="10" fill="#fff7e6" stroke="#b7791f" stroke-width="2"/>
  <text x="575" y="172" text-anchor="middle" font-size="15" font-weight="bold" fill="#7c4a03">Vite Dev Server</text>
  <text x="575" y="196" text-anchor="middle" font-size="14" fill="#7c4a03">:5175</text>
  <text x="505" y="226" font-size="13">• Serve SPA + HMR</text>
  <text x="505" y="250" font-size="13">• Proxy /api → :3001</text>
  <text x="505" y="274" font-size="13">• (chỉ môi trường dev)</text>

  <!-- Box C: Express -->
  <rect x="730" y="90" width="200" height="210" rx="10" fill="#e9f7ef" stroke="#276749" stroke-width="2"/>
  <text x="830" y="122" text-anchor="middle" font-size="15" font-weight="bold" fill="#22543d">Express API :3001</text>
  <line x1="745" y1="136" x2="915" y2="136" stroke="#276749" stroke-width="1"/>
  <text x="748" y="164" font-size="13">• GET /api/catalog</text>
  <text x="748" y="190" font-size="13">• GET /api/travel</text>
  <text x="748" y="216" font-size="13">• GET /api/health</text>
  <text x="748" y="242" font-size="13">• 404 JSON (/api/*)</text>
  <text x="748" y="268" font-size="13">• Security headers</text>

  <!-- Box D: images -->
  <rect x="730" y="420" width="200" height="80" rx="10" fill="#f7f7f7" stroke="#666" stroke-width="1.5"/>
  <text x="830" y="450" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">images.unsplash.com</text>
  <text x="830" y="476" text-anchor="middle" font-size="13" fill="#333">Ảnh khách sạn (ngoại mạng)</text>

  <!-- Arrows -->
  <line x1="430" y1="200" x2="488" y2="200" stroke="#1f3b73" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="490" y1="222" x2="432" y2="222" stroke="#1f3b73" stroke-width="2" marker-end="url(#arr)"/>
  <text x="460" y="192" text-anchor="middle" font-size="12" fill="#1f3b73">HTTP</text>
  <text x="460" y="240" text-anchor="middle" font-size="12" fill="#1f3b73">JS/HTML</text>
  <line x1="660" y1="215" x2="728" y2="215" stroke="#b7791f" stroke-width="2" marker-end="url(#arr)"/>
  <text x="694" y="205" text-anchor="middle" font-size="12" fill="#7c4a03">proxy /api</text>
  <line x1="430" y1="330" x2="728" y2="330" stroke="#1f3b73" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#arr)"/>
  <text x="580" y="320" text-anchor="middle" font-size="12.5" fill="#1f3b73">production: gọi cùng origin (reverse proxy) hoặc VITE_API_BASE</text>
  <line x1="430" y1="460" x2="728" y2="460" stroke="#666" stroke-width="2" marker-end="url(#arr)"/>
  <text x="580" y="450" text-anchor="middle" font-size="12.5" fill="#444">tải ảnh thẻ khách sạn</text>

  <text x="480" y="575" text-anchor="middle" font-size="13" fill="#555">Lưu ý: booking &amp; phiên đăng nhập KHÔNG đi qua API — lưu trên trình duyệt (localStorage) theo từng tài khoản.</text>
</svg>
</body></html>
